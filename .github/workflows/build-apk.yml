name: Construir APK Android
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Localizar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android /opt -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "No se encontró sdkmanager"; exit 1; fi
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDKMANAGER"
          "$SDKMANAGER" --version
      - name: Instalar componentes del SDK Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar APK
        run: gradle -p android assembleDebug
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Estudio-de-Derecho-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
